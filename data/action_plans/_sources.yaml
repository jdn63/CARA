# Canonical umbrella sources for CARA action plan recommendations.
#
# Editing rules:
#  - Each entry must be a real, verified URL. Re-verify quarterly and
#    bump the `verified` date when re-checked.
#  - Prefer landing pages over deep PDFs when both substantively cover
#    the cited content; landing pages survive reorganizations longer.
#  - `title` is the document title as published; do not paraphrase.
#  - `org` is the publishing organization, used in visible link text.
#  - One source may be referenced by many activities. Avoid duplicating
#    sources here.

sources:


# CARA Risk Assessment Weight Configuration
# This file documents the weights used in risk calculations for transparency.
# NOTE: The actual overall domain weights are defined in utils/data_processor.py
# and use a PHRAT quadratic mean formula (p=2), not a simple linear weighted sum.
# This file is used as a reference and for sub-domain weight configuration.

# Primary PHRAT Domain Weights (must sum to 1.0)
# These are the actual weights used in utils/data_processor.py
# Only data-backed domains are included in the primary PHRAT score
#
# WEIGHT RATIONALE:
# Weights reflect the relative frequency, severity, and breadth of public health
# impact for each hazard type in Wisconsin, informed by:
#   - FEMA National Risk Index annualized expected loss data for Wisconsin
#   - CDC PHEP (Public Health Emergency Preparedness) capability priorities
#   - Wisconsin DHS Hazard Vulnerability Assessment guidance
#   - Historical disaster declaration frequency (FEMA, 2000-2024)
#
# Natural Hazards (28%): Highest weight because FEMA NRI data shows natural
#   hazards produce the largest annualized expected losses in WI. Covers 4 sub-types
#   (flood, tornado, winter storm, thunderstorm), each with independent data sources.
#   Reduced from 33% since dam failure is now a separate domain.
# Health Metrics (17%): Infectious disease is a core PHEP capability.
#   Reduced from 20% since vector-borne disease is now a separate domain.
# Active Shooter (18%): CDC/ASPR identifies active shooter as a high-consequence
#   threat requiring dedicated PHEP planning.
# Air Quality (12%): EPA data shows increasing wildfire smoke episodes affecting WI.
# Extreme Heat (11%): NOAA data shows heat as the leading weather-related cause
#   of death nationally; WI's northern latitude tempers exposure.
# Dam Failure (7%): Standalone domain using NID data, WI DNR dam inventory,
#   and FEMA flood data. Separated from natural hazards for granular assessment.
# Vector-Borne Disease (7%): Lyme disease (WI top-5 nationally), West Nile Virus,
#   Anaplasmosis. Uses WI DHS surveillance data and climate-adjusted exposure models.
#
# These weights are configurable. Jurisdictions may adjust them based on local
# hazard profiles and planning priorities. Changes should be documented.
overall_risk_weights:
  natural_hazards: 0.26    # 26% - Natural disasters, weather events (was 28%; -2 to make room for hazmat split)
  health_metrics: 0.16     # 16% - Disease surveillance, healthcare capacity (was 17%; -1)
  active_shooter: 0.17     # 17% - Active shooter and violence risk (was 18%; -1)
  extreme_heat: 0.10       # 10% - Heat vulnerability and climate risk (was 11%; -1)
  air_quality: 0.11        # 11% - Environmental health, AQI assessment (was 12%; -1)
  dam_failure: 0.07        # 7% - Dam/levee failure risk (NID, WI DNR, FEMA NRI flood)
  vector_borne_disease: 0.07  # 7% - Tick/mosquito-borne disease (WI DHS, CDC ArboNET)
  hazmat_industrial: 0.03  # 3% - Fixed-site industrial hazmat scored from EPA TRI + EPCRA Tier II + WI Regional Hazmat Response System (Wis. Stat. 323.13). PH action layer emphasizes medical countermeasures (CHEMPACK/SNS/ASPR/CHEMM/ATSDR) as preparedness coordination, not as a scoring input; CHEMPACK cache locations are federally confidential (42 U.S.C. 247d-6b) and are never used to score counties.
  hazmat_agricultural: 0.03  # 3% - Agricultural hazmat (anhydrous ammonia, pesticide drift, manure-pit H2S). USDA Census of Ag + WI DATCP ACCP + CDC NIOSH ag.
  # Total = 1.00. Hazmat split mirrors the v28.4 content-layer scaffolding;
  # 3% + 3% reflects the smaller annualized-loss footprint of hazmat events
  # relative to natural hazards while preserving a distinct PH-vs-EM action
  # plan voice (PH on MCM, EM on EPCRA/NFPA 470/WEM SERB).

# Supplementary Domains (modeled from proxy indicators, NOT included in PHRAT score)
# These are displayed separately on the dashboard for planning context
supplementary_domains:
  utilities: supplementary       # Modeled from proxy indicators (county characteristics + SVI)

# SVI Adjustment Factors
# Controls how much CDC Social Vulnerability Index themes adjust risk scores.
# Each value is a maximum multiplier increase (e.g., 0.25 = up to 25% increase).
#
svi_adjustment_factors:
  natural_hazards_housing: 0.50          # Housing/transportation SVI → natural hazard vulnerability
  extreme_heat_socioeconomic: 0.20       # Socioeconomic SVI → heat vulnerability
  active_shooter_household: 0.30         # Household composition SVI → active shooter vulnerability

# Temporal Risk Component Weights (must sum to 1.0)
# These apply to all risk domains and determine time-based prioritization.
#
# As of 2026-05 CARA is strategic-only. The Acute component has been
# formally retired from every non-infectious domain (no Acute key here)
# so it cannot be re-enabled by accident, and the former
# `emergency_response` mode block was removed for the same reason. The
# only domain that still uses Acute is infectious_disease, where it
# replaces Trend (outbreaks come in waves, not smooth multi-year
# trends). See utils/temporal_risk.calculate_components() and
# utils/bsta_visualization.py.
temporal_weights:
  # Strategic Planning Mode (only mode CARA supports)
  strategic_planning:
    baseline: 0.60    # 60% - Long-term structural risks (1-10 years)
    seasonal: 0.25    # 25% - Predictable cyclical variations
    trend: 0.15       # 15% - Medium-term directional changes (real data from NOAA/FEMA/Census)
    # acute key intentionally omitted -- retired 2026-05.

  # Domain-specific temporal weight overrides
  # These override the mode-level weights for specific risk domains
  domain_overrides:
    infectious_disease:
      baseline: 0.60    # 60% - Long-term structural health risk
      seasonal: 0.25    # 25% - Respiratory illness seasonality (flu/RSV peaks)
      trend: 0.00       # 0% - Disabled: county-level ID trend data insufficient
      acute: 0.15       # 15% - Active surveillance: CDC NSSP respiratory ED visits, outbreak alerts

# Active Shooter Risk Domain Weights (must sum to 1.0)
active_shooter_weights:
  historical_incident_density: 0.25    # 25% - Past incident patterns
  school_youth_vulnerability: 0.20     # 20% - Educational institution risk
  social_community_fragility: 0.20     # 20% - Social cohesion factors
  mental_behavioral_health: 0.20       # 20% - Mental health indicators
  access_lethal_means: 0.15            # 15% - Firearm accessibility

# Natural Hazards Sub-domain Weights (within natural_hazards domain)
# Each hazard uses the Exposure-Vulnerability-Resilience (EVR) framework
# with climate change projections applied to the exposure component.
# Thunderstorm risk uses independent NOAA Storm Events Database severity data.
natural_hazards_weights:
  flood: 0.25                # FEMA NRI + NOAA/WICCI climate projections
  tornado: 0.25              # FEMA NRI + NOAA/IPCC climate projections
  winter_storm: 0.25         # FEMA NRI + climate projections
  thunderstorm: 0.10         # Hail + Lightning only (v28.6 split). NOAA Storm Events Database.
  straight_line_wind: 0.15   # Damaging non-tornadic convective wind incl. derechos (v28.6 split).
                             # NOAA Storm Events (Thunderstorm Wind / Strong Wind / High Wind /
                             # Funnel Cloud) + EPA/NOAA climate projection for convective wind.
                             # Combined thunderstorm+straight_line_wind = 0.25 matches the pre-v28.6
                             # single-thunderstorm weight; 60/40 split reflects WI event-volume share
                             # (wind types ~61% of historical convective events 2015-2024).
# ENFORCEMENT (v28.7 review fix #1): these weights are NOT documentation;
# utils/data_processor.py applies them as the actual weights in the
# natural-hazards composite via a weighted RMS:
#     sqrt(sum(w_i * v_i^2) / sum(w_i))
# When a sub-hazard is unavailable, the remaining weights are
# renormalized so the composite still spans [0, 1]. The thunderstorm
# and straight_line_wind pair are collapsed inside an inner sub-RMS
# (40/60 by event volume) so their combined contribution to the outer
# composite is exactly 0.25. Any change to these weights changes the
# rendered composite immediately; no code change required.

# EVR Residual Risk Formula (for all natural hazards):
# Risk = (Exposure × Vulnerability) × (1.5 - Resilience) × Health_Impact_Factor
# - Exposure and Vulnerability are multiplicative (not weighted averages)
# - Resilience acts as a centered modifier: low resilience (0.1) → 1.4x,
#   average resilience (0.5) → 1.0x (neutral), high resilience (0.9) → 0.6x
# - Health Impact Factor from FEMA NRI (typically 0.8-1.5)
# See utils/risk_calculation.py calculate_residual_risk()

# SVI Theme Weights within Vulnerability Component (per hazard type)
# All 4 CDC SVI themes are integrated alongside Census demographic factors.
# Weights vary by hazard type to reflect hazard-specific vulnerability drivers.
natural_hazards_svi_vulnerability_weights:
  flood:
    housing_transportation: 0.30   # Housing quality, flood zone structures
    socioeconomic: 0.20            # Recovery capacity, insurance access
    household_composition: 0.15    # Aged 65+/disabled evacuation challenges
    minority_status: 0.10          # Language barriers, equitable warning access
    # Census factors: aged_65_plus_pct (0.15), mobile_home_pct (0.10)
  tornado:
    housing_transportation: 0.25   # Mobile homes, building structural integrity
    socioeconomic: 0.15            # Shelter access, recovery resources
    household_composition: 0.10    # Vulnerable populations
    minority_status: 0.10          # Warning access, language barriers
    # Census factors: mobile_home_pct (0.25), aged_65_plus_pct (0.10), pop_density (0.05)
  winter_storm:
    housing_transportation: 0.20   # Heating infrastructure, vehicle access
    socioeconomic: 0.10            # Heating affordability, weatherization
    household_composition: 0.15    # Aged 65+ cold vulnerability
    minority_status: 0.05          # Language barriers for warnings
    # Census factors: aged_65_plus_pct (0.20), mobile_home_pct (0.05), power_grid_vuln (0.15), rural_isolation (0.10)
  thunderstorm:
    housing_transportation: 0.25   # Building stock, structural protection
    socioeconomic: 0.10            # Recovery and insurance
    household_composition: 0.10    # Vulnerable populations
    minority_status: 0.05          # Warning access
    # Census factors: aged_65_plus_pct (0.10), mobile_home_pct (0.10), flood_suscept (0.15), tree_coverage (0.15)
  straight_line_wind:
    housing_transportation: 0.20   # Building envelope, roof failure, garage doors
    socioeconomic: 0.10            # Recovery resources, insurance access
    household_composition: 0.10    # Vulnerable populations (alerts, sheltering)
    minority_status: 0.05          # NWS warning access, language barriers
    # Census factors: mobile_home_pct (0.25 - dominant driver), tree_coverage (0.15),
    # power_grid_vuln (0.10), rural_isolation (0.05)

# Resilience Component Inputs (per hazard type)
# Resilience score (0-1) is computed from socioeconomic SVI inverse,
# housing SVI inverse, and hazard-specific factors
natural_hazards_resilience_inputs:
  all_hazards:
    socioeconomic_inverse: 0.20    # (1.0 - socioeconomic_svi) × 0.20
    housing_inverse: 0.10          # (1.0 - housing_transportation_svi) × 0.10
    # Plus hazard-specific base resilience factors

# Climate Change Projection Multipliers - RETIRED August 2026
# The static per-zone projection multipliers (flood 1.15-1.25, tornado
# 1.08-1.15, winter storm 1.05-1.12, thunderstorm 1.12-1.22, straight-line
# wind 1.18-1.30) were removed from all hazard exposure formulas: they
# applied one literature constant to every county in a three-zone map,
# creating score differences no local measurement supported.  Climate signal
# now comes from OBSERVED NOAA nClimDiv county trends (utils/climate_trends.py):
# flood carries a measured precipitation-trend percentile, extreme heat and
# vector-borne disease use each county's measured warming.  The retired
# weights moved onto each hazard's measured NOAA storm-events percentile.
# See the methodology page climate section for the full disclosure.

# Health Metrics Sub-domain Weights (within health_metrics domain)
health_metrics_weights:
  respiratory_illness: 0.40    # 40% - ILI, COVID, RSV surveillance
  vaccination_coverage: 0.25   # 25% - Community immunity levels
  healthcare_capacity: 0.20    # 20% - Hospital beds, staffing
  vulnerable_populations: 0.15 # 15% - Aged 65+, immunocompromised

# Extreme Heat Sub-domain Weights (within extreme_heat domain)
extreme_heat_weights:
  vulnerability_index: 0.40    # 40% - CDC Heat Vulnerability Index
  urban_heat_island: 0.30      # 30% - City-specific temperature amplification
  climate_projections: 0.20    # 20% - Long-term temperature trends
  adaptation_capacity: 0.10    # 10% - Cooling centers, infrastructure

# Jurisdiction-Specific Overrides
# Format: jurisdiction_id or county_name
jurisdiction_overrides:
  # Example for high-risk urban areas
  milwaukee_county:
    overall_risk_weights:
      active_shooter: 0.25    # Increase active shooter weight for urban area
      natural_hazards: 0.28   # Adjust natural hazards weight

# Normalization Configuration
normalization:
  # Method: 'zscore', 'quantile', 'minmax', or 'none'
  # Note: 'zscore' centers values around 0 which can cause near-zero weighted sums
  # Using 'none' preserves the original 0-1 scaled domain scores for proper weighting
  method: 'none'
  
  # Z-score normalization parameters
  zscore:
    # How many standard deviations to consider as outliers
    outlier_threshold: 3.0
    # Whether to clip outliers to threshold
    clip_outliers: true
  
  # Quantile normalization parameters  
  quantile:
    # Quantile range for scaling (e.g., 0.05-0.95 removes extreme 5% on each end)
    lower_quantile: 0.05
    upper_quantile: 0.95

# Contribution Logging Configuration
contribution_logging:
  # Enable detailed variable contribution tracking
  enabled: true
  
  # Number of top contributing variables to log per domain
  top_contributors_count: 5
  
  # Log level for contribution messages
  log_level: 'INFO'
  
  # Include raw variable values in logs
  include_raw_values: true
  
  # Include normalized values in logs
  include_normalized_values: true

# =============================================================================
# EMERGENCY MANAGEMENT DISCIPLINE CONFIGURATION
# =============================================================================
# The following sections define alternative weights for Emergency Management (EM)
# assessments. EM uses the SAME exposure scores and data sources as Public Health,
# but adjusts vulnerability and resilience weights to emphasize critical
# infrastructure impacts rather than population health outcomes.
#
# WEIGHT RATIONALE (EM):
# Weights reflect emergency management priorities informed by:
#   - FEMA Comprehensive Preparedness Guide (CPG) 201
#   - Wisconsin Emergency Management (WEM) hazard mitigation planning guidance
#   - National Infrastructure Protection Plan (NIPP) framework
#   - EMAP (Emergency Management Accreditation Program) standards
#
# Key differences from Public Health weights:
#   - Natural Hazards increased (32%): Infrastructure damage is the primary EM concern
#   - Natural Hazards elevated (32%): Infrastructure damage from natural disasters is core EM
#   - Utilities elevated (12%): Critical infrastructure disruption is core EM
#   - Dam Failure elevated (10%): EM prioritizes infrastructure failure scenarios
#   - Disease/health family reduced to 8% combined (v30.1): CARA's EM view is a
#     long-term strategic planning lens, not an acute surveillance tracker.
#     Infectious and vector-borne disease stay scored and visible on their
#     tiles, but carry minimal composite weight and are excluded from the EM
#     top-5 risk ranking (see utils/summary_content.py).
#   - Active Shooter (11%): EM focuses on response, not prevention
#   - Air Quality (8%): Less direct infrastructure impact

em_overall_risk_weights:
  natural_hazards: 0.32    # 32% - Infrastructure damage from natural disasters (was 28%; v30.1 EM strategic reweight)
  health_metrics: 0.04     # 4% - Healthcare system capacity/surge (was 9%; v30.1 disease deemphasis)
  active_shooter: 0.11     # 11% - Mass casualty incident response
  extreme_heat: 0.10       # 10% - Power grid stress, infrastructure degradation (was 11%; v30.1)
  air_quality: 0.08        # 8% - Shelter-in-place, HVAC system impacts
  utilities: 0.12          # 12% - Critical infrastructure disruption (was 9%; v30.1)
  dam_failure: 0.10        # 10% - Dam/levee failure infrastructure impact (was 7%; v30.1)
  vector_borne_disease: 0.02  # 2% - Environmental health monitoring (was 6%; v30.1 disease deemphasis)
  infectious_disease: 0.02  # 2% - EM-relevant disease awareness (mass-care screening, shelter ops; was 5%)
  hazmat_industrial: 0.045  # 4.5% - Fixed-site industrial hazmat (EPCRA Tier II, NFPA 470, DOT ERG, CISA Chemical Sector, WEM SERB Regional Hazmat Teams). EM voice emphasizes response posture, hazmat team mutual aid, and HMP integration.
  hazmat_agricultural: 0.045  # 4.5% - Agricultural hazmat (anhydrous ammonia, pesticide retailers, manure-pit H2S, agricultural transportation incidents). EM voice emphasizes county fire/EMS rural response capability and WI DATCP coordination.
  # Total = 1.00. v30.1 EM strategic reweight (August 2026): the disease and
  # health family (health_metrics + infectious_disease + vector_borne_disease)
  # is cut to 8% combined and the freed weight moved onto core EM
  # infrastructure domains, because CARA's EM view is a long-term strategic
  # planning tool rather than an acute surveillance tracker. EM hazmat weights
  # (4.5% each) now intentionally exceed the PH hazmat weights (3% each).

# EM Vulnerability Weights within EVR Natural Hazards
# Shifts emphasis from population health to critical infrastructure
em_natural_hazards_svi_vulnerability_weights:
  flood:
    housing_transportation: 0.35   # Critical infrastructure in flood zones
    socioeconomic: 0.10            # Recovery funding capacity
    household_composition: 0.05    # Reduced — less EM-specific
    minority_status: 0.05          # Warning/communication access
    infrastructure_density: 0.15   # Roads, bridges, utilities in flood plains
    mobile_home_factor: 0.10       # Temporary housing/shelter needs
    elderly_factor: 0.05           # Evacuation logistics
    rural_isolation: 0.15          # Access/response time challenges
  tornado:
    housing_transportation: 0.30   # Structural vulnerability of buildings
    socioeconomic: 0.10            # Debris removal, recovery resources
    household_composition: 0.05    # Reduced — less EM-specific
    minority_status: 0.05          # Warning access
    infrastructure_density: 0.15   # Power lines, cell towers, critical facilities
    mobile_home_factor: 0.25       # Highest structural risk
    elderly_factor: 0.05           # Shelter logistics
    pop_density: 0.05              # Scale of impact
  winter_storm:
    housing_transportation: 0.25   # Road clearance, transportation networks
    socioeconomic: 0.05            # Reduced — less EM-specific
    household_composition: 0.05    # Reduced
    minority_status: 0.05          # Communication barriers
    power_grid_vulnerability: 0.25 # Grid failure, heating systems
    rural_isolation: 0.20          # Road access, emergency response time
    mobile_home_factor: 0.05       # Heating vulnerability
    elderly_factor: 0.10           # Welfare check logistics
  thunderstorm:
    housing_transportation: 0.30   # Structural damage, tree coverage
    socioeconomic: 0.05            # Recovery resources
    household_composition: 0.05    # Reduced
    minority_status: 0.05          # Warning access
    infrastructure_density: 0.15   # Power lines, communication towers
    tree_coverage: 0.15            # Debris, power line damage
    flood_susceptibility: 0.15     # Flash flooding from storms
    mobile_home_factor: 0.10       # Structural vulnerability
  straight_line_wind:
    housing_transportation: 0.25   # Roof loss, envelope failure, garage doors
    socioeconomic: 0.05            # Recovery resources
    household_composition: 0.05    # Reduced
    minority_status: 0.05          # Warning access
    infrastructure_density: 0.15   # Overhead distribution lines, cell towers
    tree_coverage: 0.15            # Tree-fall on lines/structures, debris fields
    mobile_home_factor: 0.20       # Highest non-tornadic wind structural risk
    rural_isolation: 0.10          # Long restoration times, response distance

# EM Resilience Component Inputs
# Emphasizes infrastructure preparedness and mutual aid over social resilience
em_resilience_inputs:
  all_hazards:
    socioeconomic_inverse: 0.10        # Reduced from PH (0.20) — less direct relevance
    housing_inverse: 0.15              # Increased — infrastructure quality proxy
    infrastructure_preparedness: 0.25  # EM-specific: mutual aid, equipment, plans
    response_capacity: 0.25            # EM-specific: staffing, vehicles, EOC capability
    communication_systems: 0.15        # Warning systems, backup communications
    backup_power: 0.10                 # Generator coverage, grid redundancy

# =============================================================================

# Disease Alert Thresholds (NNDSS-derived heuristics)
# These thresholds gate the boolean "elevated" outbreak flags in
# utils/nndss_communicable.py and utils/disease_surveillance.py and are
# surfaced on the dashboard / herc print summary. They are CARA-specific
# operational heuristics, NOT CSTE-defined outbreak case definitions or
# CDC published aberration-detection thresholds. Externalized here so
# the assumptions are inspectable and tunable without code changes.
#
# meningococcal_elevated has no tunable threshold here: per CDC
# guidance any current-week meningococcal case is operationally
# significant due to the disease's severity and outbreak potential,
# so the trigger is hard-coded as "any case OR YTD running ahead of
# prior YTD" and does not need configuration.
#
# Pertussis was removed in v28.7. The prior pertussis_elevated flag was
# a CARA-specific operational heuristic (1.5x 5-year weekly median,
# floor 5 cases) without CSTE/CDC published provenance. Re-introduction
# will be considered only when a Farrington- or EARS-style aberration
# detector based on the full multi-year per-week NNDSS distribution can
# be wired in.
disease_alert_thresholds:

  # v1 Shape A outbreak flags (added 2026-05-20). Lightweight statewide
  # signals that nudge the infectious_disease Acute multiplier via the
  # stacking rule in utils/disease_surveillance.py:
  #   stacked_boost = min(0.60, max_individual + 0.05 * other_active_count)
  # Cap raised from 0.40 to 0.60 in v28.7 so multiple concurrent
  # high-tier flags can express their combined burden without clipping.
  # Isolated to infectious_disease only (design decision #5).
  # Granularity: statewide Wisconsin (design decision #2).
  # All thresholds below are CARA operational heuristics, not CSTE/CDC
  # published thresholds. Tune in this config; no code change required.

  enteric:
    # Composite GI outbreak signal. NNDSS agents tracked: Salmonellosis,
    # STEC, Shigellosis, Campylobacteriosis, Cryptosporidiosis, Giardiasis.
    # Norovirus folded into composite (no individual NNDSS feed) per
    # design decision #3.
    agent_elevated_multiplier: 1.5      # 4wk count >= 1.5x (5yr weekly median * 4)
    cluster_min_elevated_agents: 2      # >=2 agents elevated -> cluster tier
    tier_boosts:
      none: 0.00
      elevated: 0.10
      cluster: 0.25

  legionella:
    # Source: CDC NNDSS Legionellosis (Wisconsin). Separated from enteric
    # composite because PHEP response posture (building water management,
    # cooling tower investigation) is operationally distinct.
    elevated_multiplier: 2.0            # 4wk count >= 2.0x (5yr weekly median * 4)
    min_cases_floor: 4                  # also require >= 4 cases (noise floor)
    tier_boosts:
      none: 0.00
      active: 0.20

# =============================================================================
# Disease Severity Profiles (Strategic Preparedness Baseline, 2026-05-20)
# =============================================================================
# Per-disease consequence-side parameters used by utils/strategic_baseline.py
# to compute a P-times-C floor on the infectious-disease risk score. The
# floor is applied via max(current_acute_score, aggregate_baseline) inside
# utils/disease_surveillance.get_disease_metrics(). Acute case-driven paths
# remain unchanged; the floor only ever raises the displayed value.
#
# Each entry carries an explicit literature citation and source URL.
# All values are CARA-curated literature defaults pending SME review;
# tune in this config without code changes.
#
# Field definitions:
#   case_fatality_rate          - proportion of cases that die (0-1)
#   hospitalization_rate        - proportion of cases hospitalized (0-1)
#   r0                          - basic reproduction number in a fully
#                                 susceptible US population (best published estimate)
#   vulnerable_population_multiplier - >1.0 if Wisconsin demographic
#                                 distributions amplify the consequence
#                                 (e.g., aging counties, daycare networks);
#                                 1.0 = neutral
#   vulnerable_population_description - short prose for dashboard tooltip
#   citation                    - human-readable source title + year
#   citation_url                - permalink to the cited source
disease_severity_profiles:

  measles:
    display_name: 'Measles'
    case_fatality_rate: 0.002      # 1-3 per 1000 reported US cases
    hospitalization_rate: 0.20     # ~20% of reported US cases hospitalized
    r0: 15.0                       # 12-18 range; midpoint
    vulnerable_population_multiplier: 1.25
    vulnerable_population_description: 'Unvaccinated children, immunocompromised; amplified by under-95% MMR pockets in Wisconsin'
    citation: 'CDC Pink Book Chapter 13: Measles (2021)'
    citation_url: 'https://www.cdc.gov/vaccines/pubs/pinkbook/meas.html'

  # pertussis: removed in v28.7. See disease_alert_thresholds comment.

  meningococcal_disease:
    display_name: 'Meningococcal disease'
    case_fatality_rate: 0.13       # 10-15% with treatment; >50% untreated
    hospitalization_rate: 1.00     # universally hospitalized (medical emergency)
    r0: 1.4                        # household contacts; low community R0
    vulnerable_population_multiplier: 1.10
    vulnerable_population_description: 'Adolescents and young adults (college dorms), infants under 1 year'
    citation: 'CDC Pink Book Chapter 14: Meningococcal Disease (2021)'
    citation_url: 'https://www.cdc.gov/vaccines/pubs/pinkbook/mening.html'

  seasonal_influenza:
    display_name: 'Seasonal influenza'
    case_fatality_rate: 0.001      # ~0.1% CFR aggregated across seasons
    hospitalization_rate: 0.015    # 1-2% of symptomatic cases
    r0: 1.3                        # 1.2-1.5 (Biggerstaff 2014 BMC Inf Dis)
    vulnerable_population_multiplier: 1.20
    vulnerable_population_description: 'Adults 65+, pregnant persons, chronic cardiopulmonary disease'
    citation: 'Biggerstaff et al., Estimates of the reproduction number for seasonal, pandemic, and zoonotic influenza, BMC Infectious Diseases (2014)'
    citation_url: 'https://bmcinfectdis.biomedcentral.com/articles/10.1186/1471-2334-14-480'

  covid19:
    display_name: 'COVID-19 (post-vaccine era)'
    case_fatality_rate: 0.008      # 0.5-1% in post-Omicron era with mixed immunity
    hospitalization_rate: 0.030    # 2-5% of symptomatic; varies by variant
    r0: 3.5                        # Omicron and successors; 2-5 range
    vulnerable_population_multiplier: 1.20
    vulnerable_population_description: 'Adults 65+, unvaccinated, immunocompromised, COPD'
    citation: 'CDC COVID-19 Current Trends and Variant Proportions (rolling update)'
    citation_url: 'https://covid.cdc.gov/covid-data-tracker/#variant-proportions'

  rsv:
    display_name: 'Respiratory syncytial virus (RSV)'
    case_fatality_rate: 0.005      # 0.5% in infants and 65+; near 0 in healthy adults
    hospitalization_rate: 0.08     # 5-10% in vulnerable populations
    r0: 1.5                        # 1.2-2.0 range
    vulnerable_population_multiplier: 1.15
    vulnerable_population_description: 'Infants under 6 months, adults 65+, chronic lung disease'
    citation: 'CDC MMWR: RSV Disease in Older Adults (2023)'
    citation_url: 'https://www.cdc.gov/mmwr/volumes/72/rr/rr7203a1.htm'

  legionellosis:
    display_name: 'Legionellosis (Legionnaires disease)'
    case_fatality_rate: 0.10       # ~10% community-acquired; up to 25% healthcare-associated
    hospitalization_rate: 0.95     # pneumonia by definition; nearly all hospitalized
    r0: 0.0                        # no documented person-to-person transmission
    vulnerable_population_multiplier: 1.20
    vulnerable_population_description: 'Adults 50+, current/former smokers, immunocompromised; aging Wisconsin water infrastructure'
    citation: 'CDC Yellow Book Chapter 4: Legionellosis (2024)'
    citation_url: 'https://wwwnc.cdc.gov/travel/yellowbook/2024/infections-diseases/legionellosis'

  salmonellosis:
    display_name: 'Salmonellosis (non-typhoidal)'
    case_fatality_rate: 0.001      # ~0.1% overall
    hospitalization_rate: 0.06     # 6% of culture-confirmed FoodNet cases
    r0: 0.3                        # primarily foodborne; secondary transmission limited
    vulnerable_population_multiplier: 1.10
    vulnerable_population_description: 'Children under 5, adults 65+, immunocompromised'
    citation: 'CDC FoodNet Annual Report (2023)'
    citation_url: 'https://www.cdc.gov/foodnet/reports/annual-reports.html'

  stec:
    display_name: 'Shiga toxin-producing E. coli (STEC)'
    case_fatality_rate: 0.005      # overall ~0.5%; HUS sequelae carry 3-5% mortality
    hospitalization_rate: 0.40     # ~40% culture-confirmed (higher in children)
    r0: 0.5                        # secondary household transmission documented
    vulnerable_population_multiplier: 1.15
    vulnerable_population_description: 'Children under 5 (HUS risk), elderly; daycare and petting-zoo outbreak settings'
    citation: 'CDC FoodNet Annual Report (2023); CDC Healthcare-Associated Infections HUS surveillance'
    citation_url: 'https://www.cdc.gov/foodnet/reports/annual-reports.html'

  shigellosis:
    display_name: 'Shigellosis'
    case_fatality_rate: 0.0005     # <0.1% in US
    hospitalization_rate: 0.20     # ~20% of culture-confirmed cases
    r0: 1.5                        # very low infectious dose; daycare amplification
    vulnerable_population_multiplier: 1.05
    vulnerable_population_description: 'Children under 5, daycare attendees and staff'
    citation: 'CDC FoodNet Annual Report (2023)'
    citation_url: 'https://www.cdc.gov/foodnet/reports/annual-reports.html'

  campylobacteriosis:
    display_name: 'Campylobacteriosis'
    case_fatality_rate: 0.0005     # <0.1%; GBS sequelae ~1/1000
    hospitalization_rate: 0.15     # 15% of culture-confirmed
    r0: 0.2                        # primarily foodborne (poultry); minimal person-to-person
    vulnerable_population_multiplier: 1.05
    vulnerable_population_description: 'Immunocompromised; Guillain-Barre syndrome risk'
    citation: 'CDC FoodNet Annual Report (2023)'
    citation_url: 'https://www.cdc.gov/foodnet/reports/annual-reports.html'

  cryptosporidiosis:
    display_name: 'Cryptosporidiosis'
    case_fatality_rate: 0.001      # near zero immunocompetent; high in advanced HIV
    hospitalization_rate: 0.05     # 5% overall
    r0: 0.8                        # waterborne and person-to-person in daycare
    vulnerable_population_multiplier: 1.10
    vulnerable_population_description: 'Immunocompromised (especially advanced HIV); recreational water exposure'
    citation: 'CDC Cryptosporidiosis surveillance summaries; MMWR'
    citation_url: 'https://www.cdc.gov/parasites/crypto/surveillance.html'

  giardiasis:
    display_name: 'Giardiasis'
    case_fatality_rate: 0.0001     # essentially 0 with treatment
    hospitalization_rate: 0.03     # 3% overall
    r0: 0.6                        # waterborne; daycare amplification
    vulnerable_population_multiplier: 1.00
    vulnerable_population_description: 'Children in daycare, international travelers, immunocompromised'
    citation: 'CDC Giardiasis Surveillance Summary; MMWR (2019)'
    citation_url: 'https://www.cdc.gov/mmwr/volumes/68/ss/ss6807a1.htm'


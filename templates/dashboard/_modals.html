<!-- Weather Refresh Modal -->
<div class="modal fade" id="weatherRefreshModal" tabindex="-1" aria-labelledby="weatherRefreshModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="weatherRefreshModalLabel">Refreshing Weather Data</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <div class="spinner-border text-primary mb-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Fetching the latest weather data...</p>
            </div>
        </div>
    </div>
</div>

<!-- HERC Region Modal -->
<div class="modal fade" id="hercModal" tabindex="-1" aria-hidden="true">

            </div>
            <div class="modal-body" id="hercModalContent">
                <!-- Content will be populated dynamically -->
                <div class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

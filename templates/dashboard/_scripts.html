<script>
document.addEventListener('DOMContentLoaded', function() {
    var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
    popoverTriggerList.map(function(el) {
        return new bootstrap.Popover(el, {
            container: 'body',
            sanitize: false
        });
    });
});
</script>

<!-- GIS Export Function for Individual Jurisdiction -->
<script>
function exportSingleJurisdiction(jurisdictionId) {
    const exportMenu = `
        <div class="dropdown">
            <button class="btn btn-success btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-download me-1"></i>Export Options
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="/api/gis/export/jurisdiction/${jurisdictionId}?format=csv">
                    <i class="fas fa-table me-2"></i>Download CSV
                </a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#" onclick="exportAllJurisdictions(); return false;">
                    <i class="fas fa-map-marked-alt me-2"></i>Export All Wisconsin Data
                </a></li>
            </ul>
        </div>
    `;
    event.target.outerHTML = exportMenu;
}

function exportAllJurisdictions() {
    window.location.href = '/#gis-export-tab';
    setTimeout(() => {
        const gisTab = document.getElementById('gis-export-tab');
        if (gisTab) {
            gisTab.click();
        }
    }, 100);
}
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // DOM loaded - initializing dashboard
    try {
        // Store risk data globally
        window.riskData = {{ risk_data|tojson }};
        
        if (!window.riskData) {
            console.warn("No risk data available for this jurisdiction");
            const noDataAlert = document.createElement('div');
            noDataAlert.className = 'alert alert-warning mb-4';
            noDataAlert.innerHTML = '<strong>Data Unavailable</strong><p>Risk assessment data is not currently available for this jurisdiction. Please try again later or select a different jurisdiction.</p>';
            const container = document.querySelector('.container-fluid');
            if (container) { container.insertBefore(noDataAlert, container.firstChild); }
            return;
        }
        
        let riskData = window.riskData;
    

    
    } catch (error) {
        console.error("Failed to initialize dashboard:", error);
        // Display a general error message at the top of the page
        const alertBox = document.createElement('div');
        alertBox.className = 'alert alert-danger alert-dismissible fade show mb-4';
        alertBox.innerHTML = `
            <strong>Dashboard Error</strong> 
            <p>There was a problem loading the risk assessment dashboard. The data may be incomplete or unavailable.</p>
            <p>Please try selecting a different jurisdiction or contact support.</p>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        
        const container = document.querySelector('.container-fluid');
        if (container) {
            container.insertBefore(alertBox, container.firstChild);
        }
    }
});

// Setup HERC and WEM modal handlers
// These functions are called from the map.js when region buttons are clicked
function showHercStats(regionId) {
    fetch(`/api/herc-region/${regionId}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                console.error('Error:', data.error);
                return;
            }
            
            const regionData = data.data || data;
            const modalContent = document.getElementById('hercModalContent');
            const modalEl = document.getElementById('hercModal');
            const modalTitle = modalEl.querySelector('.modal-title');
            
            modalTitle.innerHTML = `HERC Region ${regionId}: ${regionData.name || data.name}`;
            
            let content = `
                <div class="row">
                    <div class="col-12">
                        <h6>Counties in Region</h6>
                        <p>${(regionData.counties || data.counties || []).join(', ')}</p>
                    </div>
                </div>
            `;
            
            modalContent.innerHTML = content;
            
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        })
        .catch(error => {
            console.error('Error:', error);
        });
}

function closeHercStats() {
    const modal = bootstrap.Modal.getInstance(document.getElementById('hercModal'));
    if (modal) {
        modal.hide();
    }
}

function showWemStats(regionId) {
    fetch(`/api/wem-region/${regionId}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                console.error('Error:', data.error);
                return;
            }
            
            const regionData = data.data || data;
            const modalContent = document.getElementById('wemModalContent');
            const modalEl = document.getElementById('wemModal');
            const modalTitle = modalEl.querySelector('.modal-title');
            
            modalTitle.innerHTML = `WEM Region ${regionId}: ${regionData.name || data.name}`;
            
            let content = '<div class="row"><div class="col-12"><h6>Counties in Region</h6><p>' +
                (regionData.counties || data.counties || []).join(', ') + '</p></div></div>';

            const declarations = regionData.recent_declarations || data.recent_declarations;
            if (declarations && declarations.length > 0) {
                content += '<div class="row mt-3"><div class="col-12"><h6>Recent Emergency Declarations</h6><ul class="list-group">';
                declarations.forEach(function(declaration) {
                    content += '<li class="list-group-item"><div class="d-flex w-100 justify-content-between"><h6 class="mb-1">' +
                        declaration.type + '</h6><small>' + declaration.date + '</small></div><p class="mb-1">' +
                        declaration.description + '</p></li>';
                });
                content += '</ul></div></div>';
            }
            
            modalContent.innerHTML = content;
            
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        })
        .catch(error => {
            console.error('Error:', error);
        });
}

function closeWemStats() {
    const modal = bootstrap.Modal.getInstance(document.getElementById('wemModal'));
    if (modal) {
        modal.hide();
    }
}
</script>
